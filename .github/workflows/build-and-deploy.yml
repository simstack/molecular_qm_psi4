name: Build and Deploy molecular_qm_psi4

on:
  push:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/molecular-qm-psi4
  LOCAL_IMAGE: molecular-qm-psi4:latest

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  push-to-simstack:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and save Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.LOCAL_IMAGE }}
          docker save -o molecular-qm-psi4.tar ${{ env.LOCAL_IMAGE }}

      - name: Copy image archive to simstack.de
        uses: appleboy/scp-action@v0.1.7
        with:
          host: simstack.de
          username: simstack-runner
          key: ${{ secrets.SIMSTACK_SAAS_DEPLOY_KEY }}
          source: molecular-qm-psi4.tar
          target: /tmp

      - name: Load Docker image on simstack.de
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: simstack.de
          username: simstack-runner
          key: ${{ secrets.SIMSTACK_SAAS_DEPLOY_KEY }}
          script: |
            docker load -i /tmp/molecular-qm-psi4.tar
            rm -f /tmp/molecular-qm-psi4.tar
            docker image ls ${{ env.LOCAL_IMAGE }}

  build-apptainer:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Build Apptainer image on remote server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: int-nano.int.kit.edu
          username: software
          key: ${{ secrets.INT_NANO_DEPLOY_KEY }}
          script: |
            cd /shared/software/simstack2/containers
            rm -f molecular_qm_psi4.sif
            apptainer build molecular_qm_psi4.sif docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
